<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b5b43">
<title>Mana Nellore Partner — Restaurant Portal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar" class="hidden">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="15" fill="#0b5b43"/>
          <path d="M10 21.5c1.8-4.2 4-6.3 6-6.3s4.2 2.1 6 6.3" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <circle cx="16" cy="11" r="2.6" fill="#ffd166"/>
        </svg>
        <div class="brand-text">
          <strong>Mana Nellore</strong>
          <span>Partner</span>
        </div>
      </div>
      <div class="topbar-right">
        <button id="soundBtn" class="icon-btn" type="button" aria-label="Toggle new-order sound" title="New-order sound: on" aria-pressed="true">
          <svg class="snd-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.6 5.4a9 9 0 0 1 0 13.2"/></svg>
          <svg class="snd-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M23 9l-6 6"/><path d="M17 9l6 6"/></svg>
        </button>
        <button id="openToggle" class="open-toggle" type="button" aria-label="Toggle open or closed">
          <span class="dot"></span><span class="lbl">Open</span>
        </button>
        <button id="logoutBtn" class="icon-btn" type="button" aria-label="Log out" title="Log out">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </header>

    <main id="view"></main>

    <nav id="tabbar" class="hidden" aria-label="Portal sections">
      <button type="button" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Home</span>
      </button>
      <button type="button" data-tab="orders">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>Orders</span><em class="badge hidden" id="ordersBadge"></em>
      </button>
      <button type="button" data-tab="menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>
        <span>Menu</span>
      </button>
      <button type="button" data-tab="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
        <span>Profile</span>
      </button>
      <button type="button" data-tab="settlements">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>
        <span>Payouts</span>
      </button>
      <button type="button" data-tab="ratings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>
        <span>Ratings</span>
      </button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
