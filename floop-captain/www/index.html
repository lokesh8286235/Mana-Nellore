<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#181a17">
<title>Floop Captain</title>
<link rel="stylesheet" href="styles.css?v=20261017r70">
</head>
<body>
<div id="app-splash">
  <div class="splash-logo">🛵</div>
  <div class="splash-name">Floop</div>
  <div class="splash-sub">CAPTAIN</div>
</div>
<style>
#app-splash{position:fixed;inset:0;background:#f97316;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:splashOut 0.5s ease 1.8s forwards}
.splash-logo{font-size:64px;animation:splashIn 0.8s cubic-bezier(0.2,0.8,0.2,1) both}
.splash-name{color:#fff;font-size:28px;font-weight:700;margin-top:12px;animation:splashIn 0.8s 0.2s cubic-bezier(0.2,0.8,0.2,1) both}
.splash-sub{color:rgba(255,255,255,0.8);font-size:12px;letter-spacing:4px;margin-top:4px;animation:splashIn 0.8s 0.4s cubic-bezier(0.2,0.8,0.2,1) both}
@keyframes splashIn{from{opacity:0;transform:scale(0.8) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
</style>
<script>
setTimeout(function(){var s=document.getElementById('app-splash');if(s)s.remove();},2400);
</script>

<div id="app"></div>
<div id="toast-root" aria-live="assertive"></div>
<script src="app.js?v=20261017r70"></script>
</body>
</html>
